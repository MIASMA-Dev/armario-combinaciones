> Perfil de desarrollo con PostgreSQL real (Podman/Docker).
> Arranque de la base: `scripts/postgres-up.ps1`
> Backend: `mvn spring-boot:run -Dspring-boot.run.profiles=dev,postgres`

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/armario}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:armario}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:armario}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Google Sign-In
armario.google.client-id=
